# Render Blueprint: plano gratuito para testes (web + Postgres).
# O Postgres gratuito do Render expira em 30 dias; depois é só recriar ou apontar DATABASE_URL para outro banco.
services:
  - type: web
    name: dnapoles
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dnapoles-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: DEMO_ALWAYS_OPEN
        value: "true"
      - key: ENABLE_FAKE_PAYMENTS
        value: "true"
      - key: SEED_PASSWORD
        value: dnapoles123

databases:
  - name: dnapoles-db
    plan: free
    databaseName: dnapoles
    user: dnapoles
